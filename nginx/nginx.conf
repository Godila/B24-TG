# nginx для Bitrix-TG: reverse-proxy на web:8000 + WebSocket-ready + iFrame-friendly.
#
# TLS-сертификаты ставит certbot в /etc/letsencrypt/live/b24-tg.haragy.top/.
# До выдачи сертификата работает только блок :80 (HTTP).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Ограничение размера загрузки (вложения)
    client_max_body_size 25m;

    # Upstream на web-контейнер
    upstream bitrix_tg_web {
        server web:8000;
    }

    # --- HTTP :80 ---
    server {
        listen 80;
        server_name b24-tg.haragy.top;

        # WebSocket-friendly upgrade (для будущего Phase 3b real-time).
        location / {
            proxy_pass http://bitrix_tg_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }

    # --- HTTPS :443 (активируется после certbot) ---
    # Раскомментировать после выдачи сертификата Let's Encrypt.
