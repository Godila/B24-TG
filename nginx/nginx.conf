# nginx для Bitrix-TG: reverse-proxy на web:8000 + WebSocket-ready + iFrame-friendly.
#
# TLS-сертификаты ставит certbot в /etc/letsencrypt/live/b24-tg.haragy.top/.
# До выдачи сертификата работает только блок :80 (HTTP).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Ограничение размера загрузки (вложения)
    client_max_body_size 25m;

    # Upstream на web-контейнер
    upstream bitrix_tg_web {
        server web:8000;
    }

    # --- HTTP :80 → редирект на HTTPS ---
    server {
        listen 80;
        server_name b24-tg.haragy.top;

        # ACME-challenge для продления Let's Encrypt (webroot, если используется).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное → HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS :443 ---
    server {
        listen 443 ssl;
        http2 on;
        server_name b24-tg.haragy.top;

        ssl_certificate     /etc/letsencrypt/live/b24-tg.haragy.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/b24-tg.haragy.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:5m;

        # iFrame разрешён внутри карточки Bitrix24 портала.
        add_header X-Frame-Options "ALLOW-FROM https://b24-ye2jjz.bitrix24.ru" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.bitrix24.ru;" always;
        # HSTS (год) + запрет MIME-sniffing.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # WebSocket-friendly upgrade (для будущего Phase 3b real-time).
        location / {
            proxy_pass http://bitrix_tg_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }
}
