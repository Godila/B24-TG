    #     listen 443 ssl http2;
    #     server_name b24-tg.haragy.top;
    #
    #     ssl_certificate     /etc/letsencrypt/live/b24-tg.haragy.top/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/b24-tg.haragy.top/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # iFrame разрешён внутри карточки Bitrix24 портала.
    #     add_header X-Frame-Options "ALLOW-FROM https://b24-ye2jjz.bitrix24.ru" always;
