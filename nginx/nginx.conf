# nginx для Bitrix-TG: reverse-proxy на web:8000 + WebSocket-ready + iFrame-friendly.
#
# TLS-сертификаты ставит certbot в /etc/letsencrypt/live/b24-tg.haragy.top/.
# До выдачи сертификата работает только блок :80 (HTTP).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Логи
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Сжатие статики/API-ответов (стили, JS, JSONpoll-ы ~85 КБ → ~25 КБ).
    # text/javascript — страховка: python 3.12+ отдаёт .js с этим MIME.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Ограничение размера загрузки (вложения). 26m, а не 25m: multipart-
    # обёртка (boundary, заголовки частей) добавляет сотни байт поверх
    # тела файла — файл ровно в лимит не должен отбиваться nginx-ом
    # раньше приложения (приложение даст JSON-ошибку 413).
    client_max_body_size 26m;

    # Upstream на web-контейнер
    upstream bitrix_tg_web {
        server web:8000;
    }

    # --- HTTP :80 → редирект на HTTPS ---
    server {
        listen 80;
        server_name b24-tg.haragy.top;

        # ACME-challenge для продления Let's Encrypt (webroot, если используется).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Всё остальное → HTTPS.
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS :443 ---
    server {
        listen 443 ssl;
        http2 on;
        server_name b24-tg.haragy.top;

        ssl_certificate     /etc/letsencrypt/live/b24-tg.haragy.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/b24-tg.haragy.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:5m;

        # iFrame разрешён внутри карточки Bitrix24 портала.
        add_header X-Frame-Options "ALLOW-FROM https://b24-ye2jjz.bitrix24.ru" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://*.bitrix24.ru;" always;
        # HSTS (год) + запрет MIME-sniffing.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Статика: долгий кэш браузера — ссылки версионированы (?v=<mtime>,
        # см. _with_static_versions в web/routes/placement.py), деплой меняет
        # версию → кэш сбрасывается сам. expires (не add_header!) чтобы
        # сервер-уровневые security-заголовки продолжали наследоваться.
        location /static/ {
            proxy_pass http://bitrix_tg_web;
            expires 30d;
        }

        # WebSocket-friendly upgrade (для будущего Phase 3b real-time).
        location / {
            proxy_pass http://bitrix_tg_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }
}
