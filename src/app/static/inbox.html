<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ЧатМост — Чаты</title>
  <link rel="icon" href="/static/brand/favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="/static/brand/logo-square-192x192.png">
  <!-- Токены — единый источник цвета/шкал для всех поверхностей. -->
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
  <!-- Раскладка «Чатов» подключается ПОВЕРХ style.css и переиспользует его
       переменные/классы (.bubble*, .composer, .channel-badge…). Отдельный
       файл — нулевой диф стилей прод-виджета сделки. -->
  <link rel="stylesheet" href="/static/inbox.css">
  <!-- Alpine.js vendored локально (см. комментарий в placement.html). -->
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
  <div id="inbox" x-data="inboxApp()" x-init="init()">
    <!-- Левая панель: список диалогов -->
    <aside class="inbox-list">
      <div class="inbox-filters">
        <button type="button" :class="{active: filter==='all'}" @click="setFilter('all')">Все</button>
        <button type="button" :class="{active: filter==='tg'}" @click="setFilter('tg')">TG</button>
        <button type="button" :class="{active: filter==='max'}" @click="setFilter('max')">MAX</button>
      </div>
      <!-- Supervisor: фильтр по ответственному (UX-11; серверный — иначе
           клиентская фильтрация врала бы на постраничном списке). -->
      <div class="inbox-filters inbox-filters--managers" x-show="isSupervisor">
        <button type="button" :class="{active: managerFilter === 0}" @click="setManagerFilter(0)">Все</button>
        <template x-for="opt in managerOptions" :key="opt.id">
          <button type="button" :class="{active: managerFilter === opt.id}"
                  @click="setManagerFilter(opt.id)" x-text="opt.name"></button>
        </template>
        <button type="button" :class="{active: managerFilter === -1}" @click="setManagerFilter(-1)">Без ответственного</button>
      </div>

      <div class="empty" x-show="!loading && unanswered.length === 0 && dialogs.length === 0 && !anyListFilter">
        <span>Здесь появятся диалоги, когда клиенты напишут вам в Telegram или MAX</span>
      </div>
      <div class="empty" x-show="!loading && unanswered.length === 0 && dialogs.length === 0 && anyListFilter">
        <span>Под текущие фильтры диалогов нет</span>
      </div>

      <template x-if="unanswered.length > 0">
        <div class="inbox-group">
          <div class="inbox-section-title">Ожидают ответа</div>
          <template x-for="d in unanswered" :key="d.id">
            <button class="dialog-row" type="button" :class="{active: activeId === d.id}"
                    @click="openDialog(d)">
              <span class="dialog-avatar" aria-hidden="true" x-text="initials(d.contact_name)"></span>
              <span class="dialog-body">
                <span class="dialog-row-top">
                  <span class="dialog-title" x-text="d.contact_name || 'Неизвестный'"></span>
                  <span class="badge-unanswered" x-show="d.unanswered_count > 0"
                        x-text="d.unanswered_count"></span>
                  <span class="dialog-time tnum" x-text="listTime(d.last_msg_at)"></span>
                </span>
                <span class="dialog-row-bottom">
                  <span class="channel-badge" :class="d.messenger" x-text="channelLabel(d.messenger)"></span>
                  <span class="dialog-preview" x-text="preview(d)"></span>
                  <span class="owner-chip" x-show="isSupervisor && !d.is_mine && d.assigned_manager_name"
                        x-text="d.assigned_manager_name"></span>
                  <span class="wait-age" :class="{hot: waitAgeHot(d)}" x-text="waitAge(d)"></span>
                </span>
              </span>
            </button>
          </template>
        </div>
      </template>

      <div class="inbox-section-title" x-show="dialogs.length > 0">Диалоги</div>
      <template x-for="d in dialogs" :key="d.id">
        <button class="dialog-row" type="button" :class="{active: activeId === d.id}" @click="openDialog(d)">
          <span class="dialog-avatar" aria-hidden="true" x-text="initials(d.contact_name)"></span>
          <span class="dialog-body">
            <span class="dialog-row-top">
              <span class="dialog-title" x-text="d.contact_name || 'Неизвестный'"></span>
              <span class="badge-unread" x-show="d.unread_count > 0" x-text="d.unread_count"></span>
              <span class="dialog-time tnum" x-text="listTime(d.last_msg_at)"></span>
            </span>
            <span class="dialog-row-bottom">
              <span class="channel-badge" :class="d.messenger" x-text="channelLabel(d.messenger)"></span>
              <span class="dialog-preview" x-text="preview(d)"></span>
              <span class="owner-chip" x-show="isSupervisor && !d.is_mine && d.assigned_manager_name"
                    x-text="d.assigned_manager_name"></span>
              <span class="wait-age" :class="{hot: waitAgeHot(d)}" x-text="waitAge(d)"></span>
            </span>
          </span>
        </button>
      </template>
      <!-- Догрузка старых страниц (keyset-курсор): сервер отдал только
           голову списка по свежести. -->
      <button class="show-more" type="button" x-show="hasMore" @click="loadMore()"
              :disabled="loadingMore">
        <span x-text="loadingMore ? 'Загрузка…' : 'Показать ещё'"></span>
      </button>
    </aside>

    <!-- Правая панель: чат (разметка панели — копия placement.html; почему
         копия, а не общая — см. шапку inbox.js) -->
    <section class="inbox-chat">
      <header class="chat-header">
        <div class="contact" x-show="dialog">
          <span class="contact-name">
            <span class="channel-badge" :class="dialog?.messenger" x-text="channelLabel(dialog?.messenger)"></span>
            <span x-text="dialog?.contact_name || 'Неизвестный'"></span>
            <span class="owner-chip" x-show="isSupervisor && dialog && !dialog.is_mine"
                  x-text="'отвечает: ' + (dialog?.assigned_manager_name || '—')"></span>
          </span>
        <a class="deal-link" x-show="dialog?.deal_url" :href="dialog?.deal_url"
           target="_blank" rel="noopener"><span
           x-text="dialog?.crm_entity_type === 'lead' ? 'Лид' : 'Сделка'">Сделка</span>
          <svg class="i" aria-hidden="true"><use href="/static/icons.svg#external"/></svg></a>
        </div>
        <div class="status" x-show="!dialog && !loading">
          <span>Выберите диалог из списка слева</span>
        </div>
        <div class="status" x-show="loading">
          <span>Загрузка…</span>
        </div>
      </header>

      <main class="messages" x-ref="messages"
        @dragover.prevent @drop.prevent="onDrop($event)">
        <button class="load-older" type="button"
          x-show="messages.length > 0 && hasOlder"
          @click="loadOlder()">
          <svg class="i" aria-hidden="true"><use href="/static/icons.svg#arrow-up"/></svg>
          Загрузить ещё</button>
        <template x-for="msg in messages" :key="msg.id">
          <div class="bubble" :class="msg.direction === 'out' ? 'bubble-out' : 'bubble-in'">
            <template x-for="att in (msg.attachments || [])" :key="att.id">
              <div class="bubble-attachment" :class="'att-' + attKind(att)">
                <a x-show="attKind(att) === 'photo'" class="att-photo" :href="attSrc(att)"
                  target="_blank" rel="noopener" :title="att.file_name || 'Открыть фото'"
                  @click.prevent="openAttachment(att)">
                  <img :src="attSrc(att)" :alt="att.file_name || 'Фото-вложение'" loading="lazy">
                </a>
                <video x-show="attKind(att) === 'video'" controls preload="metadata"
                  :src="attSrc(att)"></video>
                <audio x-show="attKind(att) === 'audio'" controls preload="metadata"
                  :src="attSrc(att)"></audio>
                <a x-show="attKind(att) === 'file'" class="bubble-file" :href="attSrc(att)"
                  target="_blank" rel="noopener" download
                  @click.prevent="openAttachment(att)">
                  <span class="bubble-file-name" x-text="fileLabel(att)"></span>
                </a>
              </div>
            </template>
            <p class="bubble-text" x-show="msg.text" x-text="msg.text"></p>
            <span class="bubble-meta tnum">
              <span x-show="msg.is_autoreply" class="auto-tag">автоответ</span>
              <span x-text="formatTime(msg.created_at)"></span>
              <!-- Иконки статусов — наши строки (не юзер-данные), x-html безопасен -->
              <span class="status-badge" x-html="statusLabel(msg.direction, msg.status)"></span>
            </span>
          </div>
        </template>
        <div class="empty" x-show="dialog && messages.length === 0 && !loading">
          <span>Сообщений пока нет</span>
        </div>
        <!-- Пилюля-якорь (UX-05): тихо появляется, если новые сообщения
             пришли, пока пользователь читает историю выше. -->
        <button class="jump-new" type="button" x-show="newBelow" @click="jumpNew()">
          <svg class="i" aria-hidden="true"><use href="/static/icons.svg#arrow-down"/></svg>
          Новые сообщения
        </button>
      </main>
      <!-- A11y: анонс новых входящих скринридерам (UX-02). -->
      <div class="sr-only" aria-live="polite" x-text="liveAnnouncement"></div>

      <div class="templates" x-show="canWrite && templates.length > 0" x-data="{ open: false }">
        <button class="templates-toggle" @click="open = !open" type="button">
          <svg class="i tgl" :class="{ 'tgl--open': open }" aria-hidden="true">
            <use href="/static/icons.svg#chevron-down"/></svg>
          Шаблоны (<span x-text="templates.length"></span>)
        </button>
        <ul class="templates-list" x-show="open">
          <template x-for="tpl in templates" :key="tpl.id">
            <li>
              <button type="button" @click="useTemplate(tpl.body)" x-text="tpl.title"
                :title="tpl.title + ' — ' + tpl.body"></button>
            </li>
          </template>
        </ul>
      </div>

      <div class="status" x-show="dialog && !canWrite" style="padding:8px 14px">
        <span x-text="dialog?.is_mine
          ? 'Режим только чтение — отправка сообщений отключена администратором'
          : 'Чужой диалог — писать может только ответственный менеджер'"></span>
      </div>
      <footer class="composer" x-show="canWrite">
        <button class="attach-btn" type="button" x-show="canAttach" @click="pickFile()"
          :disabled="!dialog || sending" title="Прикрепить файл" aria-label="Прикрепить файл">
          <svg class="i i--18" aria-hidden="true"><use href="/static/icons.svg#paperclip"/></svg></button>
        <input type="file" x-ref="fileInput" hidden @change="onFilePicked($event)"
          accept="image/*,video/*,audio/*,.pdf,.zip,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
        <textarea
          x-model="draft"
          @keydown.enter="if (!$event.shiftKey) { $event.preventDefault(); send(); }"
          @paste="onPaste($event)"
          placeholder="Напишите сообщение… (Enter — отправить, Shift+Enter — перенос строки)"
          rows="2"
          :disabled="!dialog || sending"></textarea>
        <button class="send-btn" @click="send()" :class="{busy: sending}"
          :disabled="!dialog || (!draft.trim() && !pendingFile) || sending" type="button"
          title="Отправить" aria-label="Отправить">
          <svg class="i i--18" aria-hidden="true"><use href="/static/icons.svg#send"/></svg>
        </button>
        <div class="file-chip" x-show="pendingFile">
          <span class="file-chip-name" x-text="pendingFile ? pendingFile.name : ''"></span>
          <span class="file-chip-size tnum" x-text="pendingFile ? formatSize(pendingFile.size) : ''"></span>
          <button class="file-chip-x" type="button" @click="clearFile()" title="Убрать файл"
            aria-label="Убрать файл">
            <svg class="i" aria-hidden="true"><use href="/static/icons.svg#x"/></svg>
          </button>
        </div>
      </footer>

      <div class="error-banner" x-show="error" x-text="error" @click="error = ''"></div>

      <!-- Лайтбокс фото: просмотр внутри страницы (верхнеуровневая вкладка
           не видит партиционированную сессионную куку iframe-контекста). -->
      <div class="lightbox" x-show="lightboxSrc" @click="closeLightbox()"
        @keydown.escape.window="closeLightbox()" role="dialog" aria-label="Просмотр изображения">
        <img :src="lightboxSrc" alt="">
      </div>
    </section>
  </div>

  <script src="/static/inbox.js"></script>
</body>
</html>
