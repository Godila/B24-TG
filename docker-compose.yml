services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bitrix_tg
      POSTGRES_USER: bitrix_tg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitrix_tg"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Без ports — postgres доступен только внутри docker-сети (безопасно).

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # Без ports — redis доступен только внутри docker-сети (безопасно).

  web:
    build: .
    command: ["python", "-m", "app.main", "web"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"  # только для nginx внутри сети, НЕ публикуется наружу
    restart: unless-stopped

  bridge:
    build: .
    command: ["python", "-m", "app.main", "bridge"]
    env_file: .env
    volumes:
      - tg_sessions:/data/tg_sessions
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - letsencrypt_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  tg_sessions:
  letsencrypt:
  letsencrypt_www:
