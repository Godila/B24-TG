# Логи в journald: переживают пересоздание контейнеров при деплоях
# (json-file умирал вместе с контейнером — инцидент 08-18 разбирали
# вслепую) и ротируются самим журналом. Смотреть:
#   journalctl -t chatmost.<имя-контейнера>   |   docker compose logs
# Имя проекта: контейнеры chatmost-<svc>-1, сеть chatmost_default, образ
# chatmost-web (тома после миграции 08-22 тоже chatmost_*).
name: chatmost

x-logging: &default-logging
  driver: journald
  options:
    tag: "chatmost.{{.Name}}"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bitrix_tg
      POSTGRES_USER: bitrix_tg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitrix_tg"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Без ports — postgres доступен только внутри docker-сети (безопасно).

  web:
    logging: *default-logging
    build: .
    command: ["python", "-m", "app.main", "web"]
    env_file: .env
    volumes:
      # Общий том с bridge: файл, загруженный менеджером через web, bridge
      # читает для отправки в канал (разделяемое состояние — БД + медиа).
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"  # только для nginx внутри сети, НЕ публикуется наружу
    restart: unless-stopped

  bridge:
    logging: *default-logging
    build: .
    command: ["python", "-m", "app.main", "bridge"]
    env_file: .env
    volumes:
      - tg_sessions:/data/tg_sessions
      # Скачанные из каналов медиа раздаёт web (тот же том).
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # WhatsApp-шлюз (OpenWA, движок Baileys): REST :2785 + Socket.IO /events.
  # Порт наружу НЕ публикуется (только docker-сеть); WA блокирован в РФ —
  # сессии создаются с proxyUrl socks5://xray-client:10808 (vless+Reality,
  # тот же туннель, что у Telethon). Дашборд оператору: ssh -L 2785:localhost:2785.
  openwa:
    logging: *default-logging
    image: ghcr.io/rmyndharis/openwa@sha256:5683c4c2dcc259d45cbcaaa0e6b2e4ecf8f2ba0c4cdb38417c9d97a6f64559ac
    container_name: openwa
    environment:
      - NODE_ENV=production
      - ENGINE_TYPE=baileys
      - RESOLVE_LID_TO_PHONE=true
      - API_MASTER_KEY=${WA_API_KEY}
    volumes:
      - openwa_data:/app/data
    expose:
      - "2785"
    mem_limit: 768m
    restart: unless-stopped

  nginx:
    logging: *default-logging
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - letsencrypt_www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped

  # MTProto-прокси: хостинг РФ блокирует подсети Telegram, поэтому Telethon
  # ходит через vless-туннель (TG_PROXY_HOST=xray-client в .env). Раньше это
  # был ручной `docker run` вне compose — при `compose down/up` сеть
  # пересоздавалась и контейнер молча терял связность. Конфиг с секретом
  # живёт ВНЕ репо: /opt/xray-client/config.json на хосте.
  xray:
    logging: *default-logging
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-client
    # Без явной команды образ запускает дефолтный конфиг-каталог с примерами.
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - /opt/xray-client/config.json:/etc/xray/config.json:ro
    restart: unless-stopped

volumes:
  openwa_data:
  pg_data:
  tg_sessions:
  media:
  letsencrypt:
  letsencrypt_www:
